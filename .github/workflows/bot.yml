name: Sports X Translator

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: sports-x-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Translator Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
        run: python bot.py

      - name: Save Processed Tweets
        if: always()
        run: |
          if [ -f processed_ids.txt ]; then
            cp processed_ids.txt /tmp/processed_ids_backup.txt
            git config --global user.name "github-actions"
            git config --global user.email "actions@github.com"
            git fetch origin main
            git checkout -B main origin/main
            cat /tmp/processed_ids_backup.txt >> processed_ids.txt
            awk '!seen[$0]++' processed_ids.txt > /tmp/merged_ids.txt
            mv /tmp/merged_ids.txt processed_ids.txt
            git add processed_ids.txt
            git commit -m "Update state [skip ci]" || exit 0
            git push origin main || true
          fi
